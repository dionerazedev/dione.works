    <meta name="theme-color" content="#ffffff">
    <script>
      (function () {
        var preference = 'light';
        try {
          var savedTheme = window.localStorage.getItem('dione-theme');
          if (savedTheme === 'light' || savedTheme === 'dark' || savedTheme === 'system') preference = savedTheme;
        } catch (_) {}
        var systemTheme = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        var theme = preference === 'system' ? systemTheme : preference;
        var root = document.documentElement;
        root.dataset.theme = theme;
        root.dataset.themePreference = preference;
        root.classList.toggle('dark', theme === 'dark');
        root.style.colorScheme = theme;
        var meta = document.querySelector('meta[name="theme-color"]');
        if (meta) meta.setAttribute('content', theme === 'dark' ? '#0c0c0f' : '#ffffff');
      })();
    </script>
